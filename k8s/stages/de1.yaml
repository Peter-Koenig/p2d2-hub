apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: p2d2-f-de1-code
  namespace: cc-prd-geodata-stack
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: p2d2-f-de1-config
  namespace: cc-prd-geodata-stack
data:
  APP_DEBUG: "false"
  DEFAULT_CATEGORY_ICON: /images/icons/default-category.svg
  DB_HOST: central-db.cc-prd-database-stack.svc.cluster.local
  DB_PORT: "5432"
  DB_NAME: p2d2
  DB_USER: P2D2-DE1
  WFST_NAMESPACE: urn:data-dna:govdata
  WFST_WORKSPACE: de1
  PUBLIC_WFST_WORKSPACE: de1
  PUBLIC_WFST_ENDPOINT: https://geoportal.udp.data-dna.eu/geoserver/ows
  WFST_ENDPOINT: https://geoportal.udp.data-dna.eu/geoserver/ows
  WFST_ENDPOINT_DE1: https://geoportal.udp.data-dna.eu/geoserver/ows
  WFST_USERNAME: p2d2_wfst_de1
  WFST_USER_DE1: p2d2_wfst_de1
  PUBLIC_MAPSERVER_URL: https://geoportal.udp.data-dna.eu/mapserver
  PUBLIC_SITE_URL: https://f-de1.udp.data-dna.eu
  SMTP_HOST: CHANGEME
  SMTP_PORT: "587"
  SMTP_SECURE: "false"
  SMTP_USER: CHANGEME
  CONTACT_EMAIL_TO: CHANGEME
  CONTACT_EMAIL_FROM: CHANGEME
---
apiVersion: v1
kind: Secret
metadata:
  name: p2d2-f-de1-secret
  namespace: cc-prd-geodata-stack
type: Opaque
stringData:
  DB_PASSWORD: CHANGEME
  WFST_PASSWORD: CHANGEME
  WFST_PW_DE1: CHANGEME
  SESSION_SECRET: CHANGEME
  ALTCHA_HMAC_KEY: CHANGEME
  SMTP_PASS: CHANGEME
  ZITADEL_ISSUER: CHANGEME
  ZITADEL_CLIENT_ID: CHANGEME
  ZITADEL_CLIENT_SECRET: CHANGEME
  ZITADEL_PROJECT_ID: CHANGEME
  ZITADEL_ORG_ID: CHANGEME
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: p2d2-f-de1
  namespace: cc-prd-geodata-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: p2d2-f-de1
  template:
    metadata:
      labels:
        app: p2d2-f-de1
    spec:
      containers:
        - name: astro
          image: node:20-slim
          imagePullPolicy: IfNotPresent
          workingDir: /app
          command: ["node", "dist/server/entry.mjs"]
          ports:
            - containerPort: 4321
          envFrom:
            - configMapRef:
                name: p2d2-f-de1-config
            - secretRef:
                name: p2d2-f-de1-secret
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "4321"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: code
              mountPath: /app
      volumes:
        - name: code
          persistentVolumeClaim:
            claimName: p2d2-f-de1-code
---
apiVersion: v1
kind: Service
metadata:
  name: p2d2-f-de1
  namespace: cc-prd-geodata-stack
spec:
  type: ClusterIP
  selector:
    app: p2d2-f-de1
  ports:
    - name: http
      port: 80
      targetPort: 4321
