apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: p2d2-f-de1-code
  namespace: cc-prd-geodata-stack
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: p2d2-f-de1-config
  namespace: cc-prd-geodata-stack
data:
  DB_USER: P2D2-DE1
  WFST_WORKSPACE: de1
  PUBLIC_WFST_WORKSPACE: de1
  PUBLIC_SITE_URL: https://f-de1.udp.data-dna.eu
  # Server-seitiger WFS-T-Endpoint je Stage (mit Workspace-Pfad).
  WFST_ENDPOINT: https://geoportal.udp.data-dna.eu/geoserver/de1/ows
  WFST_ENDPOINT_DE1: https://geoportal.udp.data-dna.eu/geoserver/de1/ows
  WFST_USERNAME: p2d2_wfst_de1
  WFST_USER_DE1: p2d2_wfst_de1
---
apiVersion: v1
kind: Secret
metadata:
  name: p2d2-f-de1-secret
  namespace: cc-prd-geodata-stack
type: Opaque
stringData:
  # K3: Cluster-DB-Rolle P2D2-DE1 (Rotation durch Peter)
  DB_PASSWORD: CHANGEME
  # K1: GeoServer-WFS-T-Secret p2d2-geoserver-wfst-de1
  WFST_PASSWORD: CHANGEME
  WFST_PW_DE1: CHANGEME
  # K2: zufällig generiert, bleibt
  SESSION_SECRET: CHANGEME
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: p2d2-f-de1
  namespace: cc-prd-geodata-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: p2d2-f-de1
  template:
    metadata:
      labels:
        app: p2d2-f-de1
    spec:
      containers:
        - name: astro
          image: node:20-slim
          imagePullPolicy: IfNotPresent
          workingDir: /app
          command: ["node", "dist/server/entry.mjs"]
          ports:
            - containerPort: 4321
          envFrom:
            - configMapRef:
                name: p2d2-base-config
            - secretRef:
                name: p2d2-base-secret
            - configMapRef:
                name: p2d2-f-de1-config
            - secretRef:
                name: p2d2-f-de1-secret
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "4321"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: code
              mountPath: /app
      volumes:
        - name: code
          persistentVolumeClaim:
            claimName: p2d2-f-de1-code
---
apiVersion: v1
kind: Service
metadata:
  name: p2d2-f-de1
  namespace: cc-prd-geodata-stack
spec:
  type: ClusterIP
  selector:
    app: p2d2-f-de1
  ports:
    - name: http
      port: 80
      targetPort: 4321
